<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Prototype question: which information hierarchy best supports monitoring multiple Codex accounts? -->
  <title>Tibometer · 多账号监听原型</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap');
    :root {
      --ink: #14241e;
      --muted: #718078;
      --line: #d8e0da;
      --paper: #f4f7f3;
      --panel: #ffffff;
      --green: #1a8b67;
      --green-soft: #dff4e8;
      --amber: #c98634;
      --amber-soft: #fff0d4;
      --red: #c65050;
      --red-soft: #ffe1df;
      --blue: #5877b8;
      --shadow: 0 20px 55px rgba(23, 43, 33, .10), 0 3px 10px rgba(23, 43, 33, .05);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app-shell { min-height: 100vh; padding: 42px 42px 112px; }
    .eyebrow { color: var(--green); font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(30px, 4vw, 52px); letter-spacing: -.055em; line-height: .98; }
    h2 { font-size: 20px; letter-spacing: -.03em; }
    .muted { color: var(--muted); }
    .mono { font-family: 'IBM Plex Mono', monospace; }
    .topline { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; max-width: 1320px; margin: 0 auto 30px; }
    .topline p { max-width: 580px; margin-top: 12px; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .top-actions { display: flex; gap: 9px; align-items: center; }
    .button { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); padding: 10px 14px; font-size: 12px; font-weight: 700; transition: .18s ease; }
    .button:hover { border-color: var(--green); transform: translateY(-1px); }
    .button.primary { color: #fff; border-color: var(--ink); background: var(--ink); }
    .button.ghost { background: transparent; }
    .live-dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px var(--green-soft); }
    .prototype-note { position: fixed; left: 18px; top: 18px; z-index: 20; padding: 6px 9px; border: 1px solid #e0c48d; border-radius: 999px; background: #fff8e9; color: #806122; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .04em; }

    /* Variant A: command centre */
    .variant-a .workspace { display: grid; grid-template-columns: 278px minmax(0, 1fr); gap: 18px; max-width: 1320px; min-height: 590px; margin: 0 auto; }
    .a-sidebar { display: flex; flex-direction: column; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: #e9f0e9; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px 24px; font-size: 15px; font-weight: 700; }
    .brand-mark { display: grid; width: 29px; height: 29px; place-items: center; border-radius: 10px; background: var(--ink); color: #c8f1d7; font-size: 13px; }
    .section-label { padding: 0 9px 8px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .account-nav { display: grid; gap: 5px; }
    .account-nav button { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 9px; width: 100%; padding: 11px 9px; border: 0; border-radius: 11px; background: transparent; color: var(--ink); text-align: left; }
    .account-nav button:hover, .account-nav button.active { background: rgba(255,255,255,.82); }
    .account-nav small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .status-pip { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .status-pip.amber { background: var(--amber); }
    .status-pip.red { background: var(--red); }
    .nav-percent { color: var(--green); font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
    .nav-percent.amber { color: var(--amber); }
    .sidebar-bottom { margin-top: auto; padding-top: 20px; }
    .mini-sync { display: flex; justify-content: space-between; margin: 12px 2px 0; color: var(--muted); font-size: 11px; }
    .a-main { padding: 26px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); }
    .main-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .main-head p { margin-top: 8px; color: var(--muted); font-size: 13px; }
    .selected-account { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .selected-account strong { color: var(--ink); }
    .hero-metric { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin-bottom: 14px; }
    .metric-card { padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: #fbfcfb; }
    .metric-card.highlight { border-color: #b5dec6; background: linear-gradient(135deg, #f4fff8, #e6f7ed); }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-number { margin: 10px 0 8px; font-size: 39px; letter-spacing: -.07em; line-height: 1; }
    .metric-number span { color: var(--muted); font-size: 16px; letter-spacing: -.02em; }
    .progress { height: 7px; overflow: hidden; border-radius: 99px; background: #dce6df; }
    .progress > i { display: block; height: 100%; border-radius: inherit; background: var(--green); }
    .metric-foot { display: flex; justify-content: space-between; margin-top: 8px; color: var(--muted); font-size: 11px; }
    .metric-card.warning .progress > i { background: var(--amber); }
    .metric-card.warning { border-color: #ecd4ad; background: #fffaf1; }
    .timeline { margin-top: 14px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; }
    .timeline-head { display: flex; justify-content: space-between; margin-bottom: 18px; }
    .timeline-head span { color: var(--green); font-size: 12px; font-weight: 700; }
    .timeline-bar { position: relative; height: 66px; margin: 0 6px; border-bottom: 1px solid var(--line); background: repeating-linear-gradient(to right, transparent 0, transparent calc(25% - 1px), #edf1ee calc(25% - 1px), #edf1ee 25%); }
    .timeline-line { position: absolute; left: 0; right: 3%; top: 25px; height: 2px; background: var(--green); transform: rotate(-3deg); transform-origin: left; }
    .timeline-line:after { position: absolute; right: 0; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--green); content: ''; box-shadow: 0 0 0 4px var(--green-soft); }
    .timeline-labels { display: flex; justify-content: space-between; margin-top: 8px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 10px; }
    .activity { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 14px; padding: 15px 17px; border: 1px solid var(--line); border-radius: 14px; }
    .activity strong { display: block; margin-bottom: 4px; font-size: 13px; }
    .activity p { color: var(--muted); font-size: 11px; }
    .event-badge { align-self: center; padding: 6px 8px; border-radius: 7px; background: var(--green-soft); color: var(--green); font-family: 'IBM Plex Mono', monospace; font-size: 10px; }

    /* Variant B: popover */
    .variant-b { min-height: 600px; background: #d7d9dc; padding: 54px 14px; }
    .variant-b .desktop-surface { width: min(460px, 100%); margin: 0 auto; overflow: hidden; border: 1px solid #b7bbc0; border-radius: 22px; background: rgba(250,250,251,.94); box-shadow: 0 24px 65px rgba(18, 24, 30, .22); backdrop-filter: blur(18px); }
    .b-top { display: flex; justify-content: space-between; align-items: center; padding: 19px 20px 16px; }
    .b-top h2 { font-size: 16px; }
    .b-top span { color: #6b737c; font-size: 11px; }
    .b-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; padding: 0 14px 14px; }
    .b-summary-card { padding: 14px; border-radius: 14px; background: #edf0f2; }
    .b-summary-card strong { display: block; margin-top: 7px; font-size: 25px; letter-spacing: -.06em; }
    .b-summary-card small { color: #6b737c; font-size: 10px; }
    .b-summary-card.alert { background: #fff1db; }
    .b-accounts { display: grid; gap: 1px; border-top: 1px solid #e3e5e8; }
    .b-account { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 11px; width: 100%; padding: 14px 20px; border: 0; border-radius: 0; background: #fafafa; color: var(--ink); text-align: left; }
    .b-account:hover { background: #fff; }
    .avatar { display: grid; width: 31px; height: 31px; place-items: center; border-radius: 10px; background: #d9eee3; color: var(--green); font-size: 12px; font-weight: 700; }
    .avatar.amber { background: #fbe6c2; color: #a56d21; }
    .avatar.red { background: #f8d8d7; color: #a44747; }
    .b-account strong { display: block; font-size: 12px; }
    .b-account small { display: block; margin-top: 3px; color: #818891; font-size: 10px; }
    .b-account-right { text-align: right; }
    .b-account-right strong { font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
    .b-account-right small { color: #818891; }
    .b-bottom { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-top: 1px solid #e3e5e8; background: #f4f5f6; }
    .b-bottom span { color: #818891; font-size: 10px; }
    .icon-button { display: grid; width: 30px; height: 30px; place-items: center; border: 1px solid #d8dce0; border-radius: 9px; background: #fff; color: #4d5861; }

    /* Variant C: operations board */
    .variant-c { color: #f5f3ed; background: #20221f; }
    .variant-c .topline { max-width: 1240px; }
    .variant-c .eyebrow { color: #c4df74; }
    .variant-c .topline p, .variant-c .muted { color: #9aa096; }
    .variant-c .button { border-color: #484d45; background: transparent; color: #f5f3ed; }
    .variant-c .button.primary { border-color: #c4df74; background: #c4df74; color: #20221f; }
    .variant-c .board { display: grid; grid-template-columns: 1.45fr .75fr; gap: 16px; max-width: 1240px; margin: 0 auto; }
    .c-table, .c-detail { border: 1px solid #444941; border-radius: 16px; background: #292c28; }
    .c-table-head { display: grid; grid-template-columns: 1.4fr .8fr .8fr .7fr; gap: 10px; padding: 14px 18px; border-bottom: 1px solid #444941; color: #878f85; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    .c-row { display: grid; grid-template-columns: 1.4fr .8fr .8fr .7fr; gap: 10px; align-items: center; width: 100%; padding: 18px; border: 0; border-bottom: 1px solid #393d38; border-radius: 0; background: transparent; color: #f5f3ed; text-align: left; }
    .c-row:last-child { border-bottom: 0; }
    .c-row.selected { background: #30382b; box-shadow: inset 3px 0 0 #c4df74; }
    .c-name { display: flex; align-items: center; gap: 10px; }
    .c-initial { display: grid; width: 31px; height: 31px; place-items: center; border: 1px solid #59664a; border-radius: 50%; color: #c4df74; font-family: 'Instrument Serif', serif; font-size: 17px; }
    .c-name strong { display: block; font-size: 13px; }
    .c-name small { display: block; margin-top: 4px; color: #8b9488; font-size: 10px; }
    .c-cell strong { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
    .c-cell small { display: block; margin-top: 4px; color: #8b9488; font-size: 10px; }
    .c-meter { height: 5px; overflow: hidden; margin-top: 7px; border-radius: 99px; background: #464d43; }
    .c-meter i { display: block; height: 100%; border-radius: inherit; background: #c4df74; }
    .c-meter.amber i { background: #d7a261; }
    .c-status { display: inline-flex; align-items: center; gap: 6px; color: #bcd9c1; font-size: 11px; }
    .c-status.warn { color: #e0b36f; }
    .c-status.off { color: #9a9f97; }
    .c-detail { padding: 22px; }
    .detail-kicker { display: flex; justify-content: space-between; color: #899187; font-family: 'IBM Plex Mono', monospace; font-size: 10px; }
    .c-detail h2 { margin-top: 32px; font-family: 'Instrument Serif', serif; font-size: 39px; font-weight: 400; letter-spacing: -.03em; }
    .detail-sub { margin-top: 6px; color: #a6ada3; font-size: 12px; }
    .ring-wrap { display: flex; align-items: center; gap: 16px; margin: 27px 0; }
    .ring { display: grid; width: 105px; height: 105px; place-items: center; border-radius: 50%; background: conic-gradient(#c4df74 0 22%, #41483f 22% 100%); }
    .ring:after { display: grid; width: 79px; height: 79px; place-items: center; border-radius: 50%; background: #292c28; color: #f5f3ed; content: '22%'; font-family: 'IBM Plex Mono', monospace; font-size: 20px; }
    .ring-copy strong { display: block; color: #c4df74; font-size: 13px; }
    .ring-copy p { max-width: 140px; margin-top: 6px; color: #9aa096; font-size: 11px; line-height: 1.45; }
    .detail-list { display: grid; gap: 12px; margin-top: 22px; padding-top: 18px; border-top: 1px solid #444941; }
    .detail-item { display: flex; justify-content: space-between; gap: 15px; color: #929b91; font-size: 11px; }
    .detail-item strong { color: #f5f3ed; font-family: 'IBM Plex Mono', monospace; font-weight: 400; text-align: right; }
    .detail-action { width: 100%; margin-top: 24px; }

    .switcher { position: fixed; z-index: 30; bottom: 22px; left: 50%; display: flex; align-items: center; gap: 12px; transform: translateX(-50%); padding: 8px 10px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(22,27,24,.92); color: #fff; box-shadow: 0 12px 40px rgba(0,0,0,.24); backdrop-filter: blur(10px); }
    .switcher button { display: grid; width: 28px; height: 28px; place-items: center; border: 0; border-radius: 50%; background: rgba(255,255,255,.12); color: #fff; font-size: 18px; }
    .switcher button:hover { background: rgba(255,255,255,.22); }
    .switcher-label { min-width: 145px; font-size: 11px; text-align: center; }
    .switcher-label strong { color: #c4df74; }
    .toast { position: fixed; right: 22px; bottom: 86px; z-index: 40; padding: 11px 14px; border: 1px solid #b8ddc4; border-radius: 10px; background: #effaf3; color: #216f4e; box-shadow: var(--shadow); font-size: 12px; opacity: 0; transform: translateY(8px); transition: .2s ease; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 840px) {
      .app-shell { padding: 30px 16px 108px; }
      .topline { display: block; }
      .top-actions { margin-top: 20px; }
      .variant-a .workspace, .variant-c .board { grid-template-columns: 1fr; }
      .a-sidebar { min-height: auto; }
      .account-nav { grid-template-columns: repeat(2, 1fr); }
      .sidebar-bottom { display: none; }
      .c-table { overflow-x: auto; }
      .c-table-head, .c-row { min-width: 640px; }
    }
  </style>
</head>
<body>
  <div class="prototype-note">PROTOTYPE · 多账号监听</div>
  <main id="app"></main>
  <div class="toast" id="toast"></div>
  <nav class="switcher" aria-label="Prototype variants">
    <button id="prev" aria-label="Previous variant">‹</button>
    <div class="switcher-label" id="switcher-label"></div>
    <button id="next" aria-label="Next variant">›</button>
  </nav>
  <script>
    const accounts = [
      { id: 'work', initials: 'W', name: 'Work · Pro', sub: 'work@studio.example', percent: 22, state: 'good', reset: '4h 12m', plan: 'Pro' },
      { id: 'personal', initials: 'P', name: 'Personal', sub: 'personal@icloud.example', percent: 67, state: 'amber', reset: '1h 08m', plan: 'Plus' },
      { id: 'research', initials: 'R', name: 'Research lab', sub: '目录需要重新登录', percent: null, state: 'red', reset: '—', plan: '暂停' }
    ];
    const variants = [
      { key: 'A', name: 'Command centre' },
      { key: 'B', name: 'Menu bar popover' },
      { key: 'C', name: 'Operations board' }
    ];
    const state = { selected: 'work', paused: false };
    const esc = value => String(value).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    function getVariant() {
      const key = new URLSearchParams(location.search).get('variant');
      return variants.find(v => v.key === key) || variants[0];
    }
    function account(id = state.selected) { return accounts.find(a => a.id === id) || accounts[0]; }
    function dot(a) { return `<i class="status-pip ${a.state === 'good' ? '' : a.state}" aria-hidden="true"></i>`; }
    function renderA() {
      const a = account();
      return `<div class="app-shell variant-a">
        <header class="topline"><div><div class="eyebrow">Tibometer / account watch</div><h1>Quota, at a glance.</h1><p>三个独立 Codex 账号正在被监听。聚合视图把最需要注意的额度放在最前面。</p></div><div class="top-actions"><button class="button ghost" onclick="fake('全部账号刷新已排队')">↻ 刷新全部</button><button class="button primary" onclick="fake('添加账号流程已打开')">＋ 添加账号</button></div></header>
        <div class="workspace"><aside class="a-sidebar"><div class="brand"><span class="brand-mark">T</span><span>Tibometer</span></div><div class="section-label">Accounts · 3</div><div class="account-nav">${accounts.map(x => `<button class="${x.id === a.id ? 'active' : ''}" onclick="selectAccount('${x.id}')">${dot(x)}<span><b>${esc(x.name)}</b><small>${esc(x.sub)}</small></span><span class="nav-percent ${x.state === 'amber' ? 'amber' : ''}">${x.percent == null ? '—' : x.percent + '%'}</span></button>`).join('')}</div><div class="sidebar-bottom"><div class="section-label">System</div><button class="button" style="width:100%;text-align:left" onclick="fake('设置页原型已打开')">⚙ 监听设置</button><div class="mini-sync"><span><span class="live-dot"></span>Live</span><span>刚刚更新</span></div></div></aside>
          <section class="a-main"><div class="main-head"><div><div class="selected-account">${dot(a)} <strong>${esc(a.name)}</strong><span>· ${esc(a.plan)}</span></div><p>${esc(a.sub)} · 最近成功更新于 12 秒前</p></div><button class="button" onclick="fake('${state.paused ? '账号已恢复监听' : '账号已暂停监听'}'); state.paused=!state.paused; render()">${state.paused ? '▶ 恢复监听' : 'Ⅱ 暂停监听'}</button></div>
            <div class="hero-metric"><div class="metric-card highlight"><div class="metric-label">5 小时窗口 · 剩余</div><div class="metric-number">${a.percent == null ? '—' : 100 - a.percent}<span>%</span></div><div class="progress"><i style="width:${a.percent == null ? 0 : 100 - a.percent}%"></i></div><div class="metric-foot"><span>使用 ${a.percent == null ? '—' : a.percent}%</span><span>重置 ${esc(a.reset)}</span></div></div><div class="metric-card ${a.state === 'amber' ? 'warning' : ''}"><div class="metric-label">周窗口 · 使用</div><div class="metric-number">${a.percent == null ? '—' : Math.max(31, a.percent - 4)}<span>%</span></div><div class="progress"><i style="width:${a.percent == null ? 0 : Math.max(31, a.percent - 4)}%"></i></div><div class="metric-foot"><span>7 天滚动窗口</span><span>重置周一</span></div></div></div>
            <div class="timeline"><div class="timeline-head"><h2>Quota trajectory</h2><span>+4% since 09:00</span></div><div class="timeline-bar"><div class="timeline-line"></div></div><div class="timeline-labels"><span>09:00</span><span>12:00</span><span>15:00</span><span>现在</span></div></div>
            <div class="activity"><div><strong>最近事件 · 窗口恢复</strong><p>5 小时窗口在 08:42 重置，已发送本地通知和 Webhook。</p></div><span class="event-badge">DELIVERED</span></div>
          </section></div></div>`;
    }
    function renderB() {
      return `<div class="variant-b"><div class="desktop-surface"><div class="b-top"><div><h2>Tibometer</h2><span><span class="live-dot"></span>监视中 · 12 秒前更新</span></div><button class="icon-button" onclick="fake('设置页原型已打开')">⚙</button></div><div class="b-summary"><div class="b-summary-card"><small>最低剩余额度</small><strong>33%</strong></div><div class="b-summary-card alert"><small>需要注意</small><strong>1 个账号</strong></div></div><div class="b-accounts">${accounts.map(a => `<button class="b-account" onclick="selectAccount('${a.id}')"><span class="avatar ${a.state === 'good' ? '' : a.state}">${a.initials}</span><span><strong>${esc(a.name)}</strong><small>${a.state === 'red' ? '需要重新登录' : '下次刷新 · ' + a.reset}</small></span><span class="b-account-right"><strong>${a.percent == null ? '—' : 100 - a.percent + '%'}</strong><small>剩余</small></span></button>`).join('')}</div><div class="b-bottom"><span>3 个账号 · 1 个异常</span><button class="button primary" onclick="fake('刷新全部已排队')">↻ 刷新</button></div></div></div>`;
    }
    function renderC() {
      const a = account();
      return `<div class="app-shell variant-c"><header class="topline"><div><div class="eyebrow">Tibometer / operations</div><h1>Watch the edge.</h1><p>一个面向多账号值守的密度布局。状态、余量和下一次重置时间放在同一条线上。</p></div><div class="top-actions"><button class="button" onclick="fake('过滤器已打开')">⌘ K 过滤</button><button class="button primary" onclick="fake('添加账号流程已打开')">＋ 添加账号</button></div></header><div class="board"><section class="c-table"><div class="c-table-head"><span>Account</span><span>5H remaining</span><span>Weekly</span><span>Status</span></div>${accounts.map(x => `<button class="c-row ${x.id === a.id ? 'selected' : ''}" onclick="selectAccount('${x.id}')"><span class="c-name"><i class="c-initial">${x.initials}</i><span><strong>${esc(x.name)}</strong><small>${esc(x.sub)}</small></span></span><span class="c-cell"><strong>${x.percent == null ? '—' : 100 - x.percent}%</strong><span class="c-meter ${x.state === 'amber' ? 'amber' : ''}"><i style="width:${x.percent == null ? 0 : 100 - x.percent}%"></i></span></span><span class="c-cell"><strong>${x.percent == null ? '—' : Math.max(31, x.percent - 4)}%</strong><small>resets Monday</small></span><span class="c-status ${x.state === 'amber' ? 'warn' : x.state === 'red' ? 'off' : ''}"><i class="status-pip ${x.state === 'good' ? '' : x.state}"></i>${x.state === 'good' ? 'Live' : x.state === 'amber' ? 'Watch' : 'Offline'}</span></button>`).join('')}</section><aside class="c-detail"><div class="detail-kicker"><span>SELECTED ACCOUNT</span><span>#${a.id === 'work' ? '01' : a.id === 'personal' ? '02' : '03'}</span></div><h2>${esc(a.name)}</h2><p class="detail-sub">${esc(a.sub)} · ${esc(a.plan)}</p><div class="ring-wrap"><div class="ring" style="background:conic-gradient(#c4df74 0 ${a.percent == null ? 0 : a.percent}%, #41483f ${a.percent == null ? 0 : a.percent}% 100%)"></div><div class="ring-copy"><strong>${a.percent == null ? 'Connection required' : a.percent + '% used'}</strong><p>${a.percent == null ? 'Run the login flow to resume monitoring.' : '5-hour window has comfortable headroom.'}</p></div></div><div class="detail-list"><div class="detail-item"><span>Next reset</span><strong>${esc(a.reset)}</strong></div><div class="detail-item"><span>Last successful read</span><strong>${a.state === 'red' ? '2h 14m ago' : '12 sec ago'}</strong></div><div class="detail-item"><span>Notifications</span><strong>Local · Webhook</strong></div></div><button class="button primary detail-action" onclick="fake('${a.state === 'red' ? '已打开重新登录流程' : '账号已加入刷新队列'}')">${a.state === 'red' ? '重新登录账号' : '立即刷新账号'}</button></aside></div></div>`;
    }
    function render() {
      const v = getVariant();
      document.title = `Tibometer · ${v.name}`;
      document.getElementById('app').innerHTML = v.key === 'A' ? renderA() : v.key === 'B' ? renderB() : renderC();
      document.getElementById('switcher-label').innerHTML = `<strong>${v.key}</strong> · ${v.name}`;
    }
    function setVariant(key) { const url = new URL(location.href); url.searchParams.set('variant', key); history.pushState({}, '', url); render(); }
    function cycle(delta) { const current = variants.findIndex(v => v.key === getVariant().key); setVariant(variants[(current + delta + variants.length) % variants.length].key); }
    function selectAccount(id) { state.selected = id; render(); }
    function fake(message) { const toast = document.getElementById('toast'); toast.textContent = message; toast.classList.add('show'); clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => toast.classList.remove('show'), 1800); }
    document.getElementById('prev').onclick = () => cycle(-1);
    document.getElementById('next').onclick = () => cycle(1);
    addEventListener('popstate', render);
    addEventListener('keydown', event => { if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName) || document.activeElement.isContentEditable) return; if (event.key === 'ArrowLeft') cycle(-1); if (event.key === 'ArrowRight') cycle(1); });
    render();
  </script>
</body>
</html>
